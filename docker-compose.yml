# ${...} values come from .env (auto-loaded from this folder; see .env.example).
# Any of them can instead be written here directly; keep secrets in .env.

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome-server
    ports:
      - "8090:4533"
    restart: unless-stopped
    environment:
      - ND_MUSICFOLDER=/music/library  # library only: never index downloads (#103)
      - ND_DATAFOLDER=/data
      - ND_LOGLEVEL=warning
      - ND_SCANSCHEDULE=@every 10m
      - ND_LISTENBRAINZ_ENABLED=true
      - ND_LISTENBRAINZ_TOKEN=${LISTENBRAINZ_TOKEN}
      - ND_SCANNER_PURGEMISSING=always
      - http_proxy=${MUSICA_HTTP_PROXY}
      - https_proxy=${MUSICA_HTTP_PROXY}
      - no_proxy=${NO_PROXY_LIST}
      - HTTP_PROXY=${MUSICA_HTTP_PROXY}
      - HTTPS_PROXY=${MUSICA_HTTP_PROXY}
      - NO_PROXY=${NO_PROXY_LIST}
    volumes:
      - ${MUSIC_HOST_DIR}:/music:ro
      - ./navidrome_data:/data
    networks:
      - music-net

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    ports:
      - "8091:5030"
      - "50300:50300/tcp"
      - "50305:50305/udp"
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - SLSKD_SLSK_USERNAME=${SLSKD_NETWORK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_NETWORK_PASSWORD}
      - SLSKD_USERNAME=${SLSKD_UI_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_UI_PASSWORD}
      - SLSKD_SHARED_DIR=/music/library
      - SLSKD_DOWNLOADS_DIR=${SLSKD_DOWNLOADS_DIR}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_SLSK_LISTEN_PORT=50300
      - SLSKD_TRANSFERS_DOWNLOADS_EXISTING_FILE_BEHAVIOR=Overwrite
      - no_proxy=${NO_PROXY_LIST}
      - NO_PROXY=${NO_PROXY_LIST}
    volumes:
      - ${MUSIC_HOST_DIR}:/music
      - ./slskd_config:/app
    networks:
      - music-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5030/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postvinyl-proxy:
    image: ginuerzh/gost:latest
    container_name: postvinyl-proxy
    command: "-L=http://:8080 -F=socks5://${MUSICA_PROXY_USER}:${MUSICA_PROXY_PASS}@${MUSICA_PROXY_SOCKS_HOST}:${MUSICA_PROXY_SOCKS_PORT}"
    restart: unless-stopped
    networks:
      - music-net

  postvinyl:
    build: .
    container_name: postvinyl
    # a bad config stops after 3 tries instead of looping; a real crash still restarts
    restart: on-failure:3
    ports:
      - "8092:8000"
    environment:
      - PV_NAVIDROME_URL=http://navidrome:4533
      - PV_PUBLIC_ORIGIN=${PV_PUBLIC_ORIGIN}
      - PV_DEV=${PV_DEV}
      - PV_SLSKD_URL=http://slskd:5030
      - PV_SLSKD_API_KEY=${SLSKD_API_KEY}
      - PV_SECRET_KEY=${PV_SECRET_KEY}
    volumes:
      - ${MUSIC_HOST_DIR}:/music:rw
      - ${PV_DATA_DIR:-./postvinyl_data}:/postvinyl/data
      # a folder, not the file: settings writes replace it and keep a .bak beside it
      - ./postvinyl_config:/postvinyl/config
    networks:
      - music-net
    depends_on:
      navidrome:
        condition: service_started
      slskd:
        condition: service_healthy

networks:
  music-net:
    driver: bridge
