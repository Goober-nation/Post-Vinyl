# Publishes the image to GitHub Container Registry. latest follows main; a v* tag
# publishes that version.
name: Image

on:
  push:
    branches: [main]
    # Nothing here reaches the image. Tag pushes ignore this list and always build.
    paths-ignore:
      - "**.md"
      - "**.example"
      - "**/.gitignore"
      - "**/.gitattributes"
      - ".gitignore"
      - ".gitattributes"
      - "LICENSE"
      - "docs/**"
      - "tests/**"
      - "scripts/**"
      - "web/design/**"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/goober-nation/post-vinyl
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
