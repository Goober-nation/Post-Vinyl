# Post-Vinyl settings. Copy to post-vinyl.yaml and point PV_CONFIG_PATH at it.
# Secrets never go here; they stay in .env.

# Which sources this install uses, per kind. The list order is the order they
# are tried; a source left out is off. Each user can switch listed sources off
# and reorder them for themselves, but can't add one that isn't listed here.
sources:
  # Song catalogs, for typed searches and browsing.
  # Possible values: musicbrainz, deezer, listenbrainz
  #   listenbrainz only maps an artist + title to a MusicBrainz id (needs the
  #   user's ListenBrainz token); typed searches skip it.
  catalog: [musicbrainz, deezer, listenbrainz]
  # Where files are downloaded from.
  # Possible values: slskd
  download: [slskd]
  # What else may start a request besides a user's own pick.
  # Possible values: postradio, yandex (not built yet; listing them does nothing)
  request: []

# Advanced: how Post-Vinyl uses slskd. Every value is optional; the default is shown.
slskd:
  # Searches started per minute, at most. Searching faster gets the Soulseek
  # account throttled (results go near-empty while slskd looks healthy).
  searches_per_minute: 4
  # Before a request is given up as "not found", empty results must be trusted:
  # if no search has come back with results since, this check search runs.
  # It counts as healthy at this many responses or more.
  throttle_check_query: "2020"
  throttle_check_min_responses: 300
  # A failed check pauses all searching this long, then checks again.
  throttle_pause_minutes: 10
  # A peer that keeps a download queued longer than this is skipped (counts as
  # a failure for that peer). Ranking puts peers with a free upload slot first.
  queue_wait_seconds: 15
  # Peers tried for one download before it is given up.
  candidates_per_download: 5
  # A peer is banned after this many failed downloads, for this many days.
  peer_ban_failures: 3
  peer_ban_days: 7

# Folders. Every value is optional; the default is shown.
files:
  # The music folder as Post-Vinyl sees it (its container mount).
  music_dir: /music
  # Inside music_dir: where slskd saves finished downloads...
  slskd_downloads_dir: downloads/complete/soulseek
  # ...and Navidrome's library (Navidrome's music folder must be exactly this
  # one, so it never indexes half-finished downloads).
  library_dir: library
