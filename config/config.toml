[server]
port = 8000
host = "0.0.0.0"

[paths]
data_dir = "/app/data"
music_dir = "/music"
download_dir = "downloads"
searches_dir = "Searches"
library_dir = "library"
discovery_familiar_dir = "Discovery/Comfort_Zone"
discovery_new_releases_dir = "Discovery/Fresh_Picks"
discovery_exploration_dir = "Discovery/Deep_Cuts"

[navidrome]
url = "http://navidrome-server:4533"

[slskd]
url = "http://slskd:5030"

[listenbrainz]
url = "https://api.listenbrainz.org"

[search]
wait_seconds = 10
response_threshold = 10
response_cap = 250
min_wait_seconds = 3
pass_ratio_threshold = 0.75
artist_match_min_words = 3
poll_interval = 1
response_limit = 60
rate_limit_max_searches = 4
rate_limit_window_seconds = 60
rate_limit_wait_timeout_seconds = 45
query_cache_ttl_seconds = 600

[download]
check_interval = 15
max_retries_per_track = 10
bad_peer_threshold = 3
upload_limit_mb = 50
pending_timeout_minutes = 5
manual_gate_minutes = 10
orphan_grace_polls = 2
peer_ban_days = 2
missing_source_timeout_minutes = 5
history_clear_interval_minutes = 1

[recs]
comfort_zone_enabled = false
fresh_picks_enabled = false
deep_cuts_enabled = false
comfort_zone_interval_days = 1
deep_cuts_interval_days = 7
comfort_zone_playlist_name = "Comfort Zone"
fresh_picks_playlist_name = "Fresh Picks"
deep_cuts_playlist_name = "Deep Cuts"
comfort_zone_count = 1
deep_cuts_count = 5
rotation_trash_rating = 1

[fresh_picks]
pull_window = "30d"
offset = 100
count = 5
search_buffer = 25

[sync]
interval_hours = 12

[logging]
level = "INFO"
format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

[beets]
enabled = true
binary = "beet"
timeout_seconds = 120

[musicbrainz]
enabled = true
url = "https://musicbrainz.org"
timeout_seconds = 15
min_request_interval = 1.0
cache_ttl_seconds = 3600
min_score = 90
search_official_only = true
